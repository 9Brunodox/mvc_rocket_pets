repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: [
          "-rn",
          "-sn",
          "--rcfile=.pylintrc",
          "--load-plugins=pylint.extensions.docparams",
          "src/",
          "tests/",
        ]
        pass_filenames: false